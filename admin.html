<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="감사보고서를 등록하고 검색 가능 상태를 확인하는 관리 화면">
  <title>감사사례 검색서비스</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner main-header-inner">
      <nav class="main-nav" aria-label="주요 메뉴">
        <span class="page-selection-label">Page Selection</span>
        <a href="index.html">감사사례 검색</a>
        <a class="active" href="admin.html" aria-current="page">감사보고서 관리</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="intro compact" aria-labelledby="page-title">
      <p class="eyebrow">REPORT MANAGEMENT</p>
      <h1 id="page-title">감사보고서 관리</h1>
      <p>감사보고서 정보를 항목별로 입력하고 등록 상태를 확인합니다.</p>
    </section>

    <section class="upload-panel" aria-labelledby="upload-title">
      <div class="panel-heading">
        <div>
          <p class="step-label">01</p>
          <h2 id="upload-title">보고서 등록</h2>
        </div>
        <span class="mock-badge">직접 입력</span>
      </div>
      <form id="report-form" class="report-form">
        <div class="report-form-grid">
          <div class="field">
            <label for="report-date">날짜</label>
            <input id="report-date" name="date" type="date" required>
          </div>
          <div class="field">
            <label for="report-department">부서</label>
            <input id="report-department" name="department" type="text" placeholder="예: 재무과" required>
          </div>
          <div class="field">
            <label for="report-drafter">기안자</label>
            <input id="report-drafter" name="drafter" type="text" placeholder="예: 김민준" required>
          </div>
          <div class="field">
            <label for="report-audit-type">감사종류</label>
            <input id="report-audit-type" name="auditType" type="text" placeholder="예: 특정감사" required>
          </div>
          <div class="field report-discipline-field">
            <label for="report-discipline">징계양정</label>
            <input id="report-discipline" name="discipline" type="text" placeholder="예: 주의, 경고, 견책" required>
          </div>
          <div class="field report-content-field">
            <label for="report-content">내용</label>
            <textarea id="report-content" name="content" rows="6" placeholder="감사 지적사항과 조치 내용을 입력해 주세요." required></textarea>
            <input id="report-file" name="reportFile" type="file" accept=".hwp,.hwpx,.doc,.docx,.pdf" hidden>
            <div class="report-file-upload">
              <button id="upload-file-button" class="button button-secondary" type="button">감사보고서 파일 업로드</button>
              <p>HWP, HWPX, DOC, DOCX, PDF 파일을 등록할 수 있습니다.</p>
            </div>
            <div id="uploaded-file" class="uploaded-file" hidden>
              <span id="uploaded-file-name"></span>
              <strong>업로드 완료</strong>
            </div>
          </div>
        </div>
        <div class="upload-actions">
          <p>모든 항목을 입력하고 감사보고서 파일을 선택하면 검색 대상 목록에 반영됩니다.</p>
          <div class="form-actions">
            <button id="reset-form-button" class="button button-secondary" type="reset">초기화</button>
            <button id="register-button" class="button button-primary" type="submit">감사보고서 등록</button>
          </div>
        </div>
      </form>
    </section>

    <section class="registered-section" aria-labelledby="registered-title">
      <div class="panel-heading">
        <div>
          <p class="step-label">02</p>
          <h2 id="registered-title">등록완료된 감사보고서 <span id="registered-count" class="count-pill">0건</span></h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>날짜</th><th>부서</th><th>기안자</th><th>감사종류</th><th>징계양정</th><th>내용</th><th>첨부파일</th><th>등록 상태</th></tr></thead>
          <tbody id="registered-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer><p>감사사례 검색서비스 · 정적 MVP</p></footer>

  <script src="data/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
