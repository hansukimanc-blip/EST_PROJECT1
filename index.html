<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="등록된 감사보고서에서 유사 감사사례를 빠르게 찾는 검색 서비스">
  <title>감사사례 검색서비스</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner main-header-inner">
      <nav class="main-nav" aria-label="주요 메뉴">
        <span class="page-selection-label">Page Selection</span>
        <a class="active" href="index.html" aria-current="page">감사사례 검색</a>
        <a href="admin.html">감사보고서 관리</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="intro" aria-label="감사사례 검색 안내">
      <div class="main-banner">
        <img src="assets/banner_2.png" alt="감사보고서 검색 화면과 감사사례 검색서비스의 주요 기능 안내" width="2048" height="768">
      </div>
    </section>

    <section class="search-panel" aria-label="감사사례 검색 조건">
      <form id="search-form">
        <div class="field keyword-field">
          <label for="keyword-input">검색 키워드</label>
          <div class="search-line">
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
              <input id="keyword-input" name="keywords" type="search" placeholder="예: 수의계약, 계약심사" autocomplete="off">
            </div>
            <button class="button button-primary search-button" type="submit">검색</button>
          </div>
          <p class="field-help">여러 키워드는 쉼표(,) 또는 띄어쓰기로 구분하세요.</p>
        </div>

        <div class="filter-grid">
          <fieldset class="field search-mode">
            <legend>검색 방식</legend>
            <div class="segmented">
              <label><input type="radio" name="search-mode" value="and" checked><span>AND</span></label>
              <label><input type="radio" name="search-mode" value="or"><span>OR</span></label>
            </div>
          </fieldset>

          <div class="field year-field">
            <label for="year-from">감사연도</label>
            <div class="year-range">
              <select id="year-from" name="year-from" aria-label="시작 연도"><option value="">전체</option></select>
              <span>~</span>
              <select id="year-to" name="year-to" aria-label="종료 연도"><option value="">전체</option></select>
            </div>
          </div>

          <div class="field">
            <label for="department-filter">대상 부서</label>
            <select id="department-filter" name="department"><option value="">전체</option></select>
          </div>

          <div class="field">
            <label for="drafter-filter">기안자</label>
            <select id="drafter-filter" name="drafter"><option value="">전체</option></select>
          </div>

          <div class="field">
            <label for="type-filter">감사유형</label>
            <select id="type-filter" name="audit-type"><option value="">전체</option></select>
          </div>
        </div>
      </form>
    </section>

    <section class="results-section" aria-labelledby="results-heading">
      <div class="results-header">
        <div>
          <p class="section-label">SEARCH RESULTS</p>
          <h2 id="results-heading">검색 결과 <span id="result-count">0건</span></h2>
        </div>
        <button id="reset-button" class="text-button" type="button">검색 조건 초기화</button>
      </div>
      <div id="search-summary" class="search-summary" hidden></div>
      <div id="results-list" class="results-list" aria-live="polite"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <footer><p>감사사례 검색서비스 · 정적 MVP</p></footer>

  <script src="data/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
